<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ETERNIA 인증샷</title>
<meta name="theme-color" content="#15161A">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Noto+Sans+KR:wght@500;700;800&display=swap">
<style>
:root{--bg:#15161A;--panel:#1E2026;--edge:#2C2E35;--lime:#D4F03A;--rose:#C93A6B;--fg:#fff;--muted:#9A9EA7;
  --en:'Orbitron','Noto Sans KR',sans-serif;--kr:'Pretendard Variable','Noto Sans KR',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--kr);
  background-image:linear-gradient(var(--panel) 1px,transparent 1px),linear-gradient(90deg,var(--panel) 1px,transparent 1px);background-size:28px 28px;
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center}
.top{width:100%;display:flex;justify-content:space-between;font-family:var(--en);font-weight:800;font-size:11px;letter-spacing:3px;color:var(--muted)}
.top b{color:var(--lime)}
.logo{width:150px;margin-top:22px}
h1{font-family:var(--en);font-weight:900;font-size:22px;letter-spacing:3px;margin:14px 0 4px}
p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.ph{position:relative;width:100%;margin-top:20px;aspect-ratio:4/5;background:var(--panel);box-shadow:0 0 0 2px var(--edge),0 20px 50px #000a}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-touch-callout:default}
.ph .st{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;padding:24px}
.ph .st i{display:block;width:44px;height:44px;margin:0 auto 14px;border-radius:50%;border:4px solid #D4F03A33;border-top-color:var(--lime);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.how{width:100%;margin-top:18px;background:var(--panel);border:1px solid var(--edge);padding:16px 18px;text-align:left;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.how small{font-family:var(--en);font-weight:800;font-size:11px;letter-spacing:4px;color:var(--lime)}
.how strong{display:block;margin-top:8px;font-size:17px}
.how p{margin-top:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;margin-top:12px;background:var(--lime);color:#1C1D22;font-weight:800;font-size:16px;text-decoration:none;border:0;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px #5A5D66}
.btn:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.foot{margin-top:26px;font-family:var(--en);font-weight:700;font-size:10px;letter-spacing:3px;color:#5A5D66}
</style>
</head>
<body>
<main>
  <div class="top"><span>HEXABLOOM · <b>FIELD PHOTO</b></span><span>ETERNIA</span></div>
  <img class="logo" src="../assets/eternia-logo.webp" alt="ETERNIA">
  <h1>MISSION PHOTO</h1>
  <p>꼬두라미 다다른곳 · 이터니아 부스 인증샷</p>
  <div class="ph"><div class="st" id="st"><div><i></i>사진을 불러오는 중이에요…</div></div></div>
  <div class="how">
    <small>SAVE</small>
    <strong>사진을 꾹 눌러서 저장하세요</strong>
    <p>아이폰은 사진을 길게 눌러 ‘사진 앱에 저장’, 안드로이드는 ‘이미지 다운로드’를 고르면 돼요.</p>
  </div>
  <a class="btn" id="dl" href="#" target="_blank" rel="noopener">원본 사진 열기</a>
  <a class="btn ghost" href="https://hchishj-alt.github.io/eternia-exhibition/">이터니아 가상 전시 보러 가기</a>
  <div class="foot">HEXABLOOM BIOTECH · MISSION CONTROL</div>
</main>
<script>
(() => {
  const id = new URLSearchParams(location.search).get('id') || '';
  const st = document.getElementById('st'), dl = document.getElementById('dl');
  if (!/^[\w-]{10,}$/.test(id)) { st.innerHTML = '<div>사진 주소가 올바르지 않아요.<br>부스의 QR을 다시 찍어 주세요.</div>'; dl.hidden = true; return; }
  const srcs = [`https://lh3.googleusercontent.com/d/${id}=w1600`, `https://drive.google.com/thumbnail?id=${id}&sz=w1600`];
  dl.href = `https://drive.google.com/uc?export=download&id=${id}`;
  const ph = document.querySelector('.ph'), img = new Image(); img.alt = 'ETERNIA 인증샷'; img.hidden = true; ph.appendChild(img);
  let k = 0;
  img.onload = () => { img.hidden = false; st.remove(); };
  img.onerror = () => { if (++k < srcs.length) img.src = srcs[k]; else st.innerHTML = '<div>사진을 불러오지 못했어요.<br>아래 ‘원본 사진 열기’를 눌러 주세요.</div>'; };
  img.src = srcs[0];
})();
</script>
</body>
</html>
