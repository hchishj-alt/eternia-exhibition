<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>HEXABLOOM 임무 보고서</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#131418">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>/* Figma mockup → web. Units: u(N) = N design px of the Figma frame (Phone 1170 / iPad 2048 wide). */
:root{
  --bg:#FAFAFA; --ink:#1C1D22; --lime:#D4F03A; --rose:#C93A6B; --muted:#8A8F99; --sub:#5A5D66; --line:#D5D8DE;
  --dark:#15161A; --panel:#1E2026; --edge:#2C2E35; --white:#FFFFFF; --off:#E4E6EA; --ghost:#F0F1F3;
  --f-en:'Orbitron','Pretendard Variable','Noto Sans KR',system-ui,sans-serif;
  --f-kr:'Pretendard Variable','Pretendard','Noto Sans KR',system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  /* phone spec */
  --W:1170; --u:calc(min(100vw, 560px) / 1170);
  --x0:72; --top:96; --logo:60; --qfs:54; --qlh:74; --ofs:34; --oh:124; --og:20; --key:54; --navh:124; --navfs:38; --backw:220; --ghostfs:380;
  --tipfs:28; --big:1;
  color-scheme:light;
}
@media (min-width:700px){
  :root{ --W:2048; --u:min(calc(100vw / 2048), calc(100vh / 2500));
    --x0:200; --top:120; --logo:58; --qfs:64; --qlh:88; --ofs:38; --oh:140; --og:28; --key:60; --navh:130; --navfs:40; --backw:340; --ghostfs:600; }
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-kr);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:calc(4 * var(--u)) solid var(--rose);outline-offset:calc(4 * var(--u))}
textarea,input{font:inherit;color:inherit}
.app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.app.dark{background:var(--dark)}

/* ---------- frame ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.screen.dark{background:var(--dark);color:#fff}
.screen.grid{background-image:linear-gradient(#1E2026 1px,transparent 1px),linear-gradient(90deg,#1E2026 1px,transparent 1px);background-size:calc(64 * var(--u)) calc(64 * var(--u))}
.col{width:calc(var(--W) * var(--u));max-width:100%;margin:0 auto;box-sizing:border-box;padding-left:max(calc(var(--x0) * var(--u)), env(safe-area-inset-left,0px));padding-right:max(calc(var(--x0) * var(--u)), env(safe-area-inset-right,0px));position:relative}
.top{flex:none;padding-top:env(safe-area-inset-top,0px)}
.main{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;position:relative;z-index:1;-webkit-overflow-scrolling:touch}
.main>.col{padding-bottom:calc(40 * var(--u));min-height:100%;display:flex;flex-direction:column}
.dock{flex:none;position:relative;z-index:2;padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .col{padding-top:calc(20 * var(--u))}
.ghostnum{position:absolute;right:calc((var(--W) * var(--u) - 100vw) / 2 + 0px);right:max(0px, calc((100vw - var(--W) * var(--u)) / 2));bottom:calc(250 * var(--u));z-index:0;pointer-events:none;
  font-family:var(--f-en);font-weight:900;font-size:calc(var(--ghostfs) * var(--u));line-height:.8;color:var(--ghost);letter-spacing:-.02em;transform:translateX(calc(40 * var(--u)));animation:ghost 1s var(--ease) both .15s}
.screen.dark .ghostnum{color:#1E2026}
@keyframes ghost{from{opacity:0;transform:translate(calc(40 * var(--u)),calc(80 * var(--u)))}}

/* screen transitions + stagger */
.enter{animation:scrIn .55s var(--ease) both}
.enter.back{animation-name:scrInB}
.leave{animation:scrOut .38s ease both;pointer-events:none}
.leave.back{animation-name:scrOutB}

@keyframes scrInB{from{transform:translateX(-6%);opacity:0}to{transform:none;opacity:1}}
@keyframes scrOut{to{transform:translateX(-4%);opacity:0}}
@keyframes scrOutB{to{transform:translateX(4%);opacity:0}}
.rise{animation:rise .65s var(--ease) both;animation-delay:calc(var(--d,0) * 70ms + 120ms)}
@keyframes rise{from{opacity:0;transform:translateY(calc(40 * var(--u)))}to{opacity:1;transform:none}}

/* chamfer helpers: --c = cut size */
.ch-tr{clip-path:polygon(0 0,calc(100% - var(--c)) 0,100% var(--c),100% 100%,0 100%)}
.ch-trbl{clip-path:polygon(0 0,calc(100% - var(--c)) 0,100% var(--c),100% 100%,var(--c) 100%,0 calc(100% - var(--c)))}
.hexflat{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.hexpt{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
/* stroked chamfer box: outer = stroke color, ::before = fill inset by --sw */
.sbox{position:relative;--sw:calc(2 * var(--u));--c:calc(24 * var(--u));background:var(--sc,var(--line));isolation:isolate}
.sbox::before{content:"";position:absolute;inset:var(--sw);background:var(--sf,var(--white));clip-path:inherit;z-index:-1;transition:background .25s}

/* ---------- top bar ---------- */
.tb{display:flex;align-items:flex-start;padding-top:calc(var(--top) * var(--u))}
.tb svg.logo{height:calc(var(--logo) * var(--u));width:auto;flex:none}
.tb .brand{margin-left:calc(22 * var(--u));display:flex;flex-direction:column;justify-content:center;height:calc(var(--logo) * var(--u))}
.tb .brand b{font-family:var(--f-en);font-weight:700;font-size:calc(30 * var(--u));letter-spacing:calc(2 * var(--u));line-height:1}

.tb .brand small.ok{color:#6E8A00}
.tb .brand small.lime{color:var(--lime)}

.tb .num b{display:block;font-family:var(--f-en);font-weight:800;font-size:calc(52 * var(--u))}
.tb .num small{display:block;font-family:var(--f-en);font-weight:700;font-size:calc(18 * var(--u));letter-spacing:calc(3 * var(--u));color:var(--muted);margin-top:calc(10 * var(--u))}
.tb .side{margin-left:auto;font-family:var(--f-en);font-weight:800;font-size:calc(20 * var(--u));letter-spacing:calc(3 * var(--u));color:var(--muted);padding-top:calc(20 * var(--u))}
.tb .side.rose{color:var(--rose)}
.tb .side i{display:inline-block;width:calc(14 * var(--u));height:calc(14 * var(--u));border-radius:50%;background:var(--rose);margin-right:calc(10 * var(--u));animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.stage{display:block;margin-left:calc(var(--x0) * var(--u) * -1);width:calc(var(--W) * var(--u));height:auto;margin-top:calc(50 * var(--u));overflow:visible}
.stage .cur{animation:curpulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes curpulse{50%{transform:scale(1.15)}}
.stage .dn{animation:pop .4s var(--ease) both;transform-box:fill-box;transform-origin:center;animation-delay:calc(var(--i) * 40ms)}
.stage .lnfill{animation:lnfill .9s var(--ease) both}
@keyframes lnfill{from{stroke-dasharray:0 3000}}
@keyframes pop{from{transform:scale(0)}}
.sm-pad{display:none}
@media (min-width:700px){.sm-phone{display:none}.sm-pad{display:block}}

/* ---------- question head ---------- */
.chip{--c:calc(16 * var(--u));display:inline-flex;align-self:flex-start;align-items:center;gap:calc(24 * var(--u));height:calc(60 * var(--u));padding:0 calc(40 * var(--u)) 0 calc(26 * var(--u));background:var(--ink);margin-top:calc(70 * var(--u))}
.chip b{font-family:var(--f-en);font-weight:800;font-size:calc(22 * var(--u));letter-spacing:calc(3 * var(--u));color:var(--lime)}
.chip span{font-weight:700;font-size:calc(24 * var(--u));color:#fff}
.qnum{font-family:var(--f-en);font-weight:800;font-size:calc(24 * var(--u));letter-spacing:calc(4 * var(--u));color:var(--rose);margin-top:calc(52 * var(--u))}
.qtitle{margin:calc(30 * var(--u)) 0 0;font-weight:800;font-size:calc(var(--qfs) * var(--u));line-height:calc(var(--qlh) * var(--u));letter-spacing:-.01em}
.qhint{display:flex;align-items:center;margin-top:calc(14 * var(--u));font-size:calc(30 * var(--u));font-weight:600;color:var(--sub)}
.qhint i{width:calc(12 * var(--u));height:calc(12 * var(--u));background:var(--lime);margin-right:calc(14 * var(--u))}
.qhint i.m{background:var(--rose)}
.qhint em{font-style:normal;color:var(--rose);font-weight:700;margin-left:calc(24 * var(--u))}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:calc(var(--og) * var(--u));margin-top:calc(70 * var(--u))}
.opt{--c:calc(24 * var(--u));display:flex;align-items:center;min-height:calc(var(--oh) * var(--u));padding:calc(22 * var(--u)) calc(40 * var(--u)) calc(22 * var(--u)) calc(36 * var(--u));box-sizing:border-box;width:100%;transition:transform .15s}
.opt:active{transform:scale(.985)}
.opt .k{flex:none;width:calc(var(--key) * var(--u) * 1.14);height:calc(var(--key) * var(--u) * .99);margin-left:calc(var(--key) * var(--u) * -.07);background:#BFC3CB;display:grid;place-items:center;position:relative;transition:background .25s}
.opt .k::before{content:"";position:absolute;inset:calc(3 * var(--u));background:#fff;clip-path:inherit;transition:background .25s}
.opt .k span{position:relative;font-family:var(--f-en);font-weight:800;font-size:calc(var(--key) * var(--u) * .47);color:var(--muted)}
.opt .k.sq{width:calc(var(--key) * var(--u));height:calc(var(--key) * var(--u));margin-left:0;border-radius:calc(6 * var(--u));clip-path:none}
.opt .k.sq::before{border-radius:calc(4 * var(--u))}
.opt .k svg{position:absolute;width:55%;height:55%;stroke:var(--ink);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .3s .05s}
.opt .t{flex:1;min-width:0;margin-left:calc(44 * var(--u));font-size:calc(var(--ofs) * var(--u));font-weight:500;line-height:1.3;color:#2E3038;transition:color .2s}
.opt .sl{display:none;font-family:var(--f-en);font-weight:800;font-size:calc(22 * var(--u));letter-spacing:calc(3 * var(--u));color:var(--lime);margin-left:calc(20 * var(--u));white-space:nowrap}
@media (min-width:700px){.opt.on .sl{display:block}}
.opt.on{--sc:var(--ink);--sf:var(--ink)}
.opt.on .k::before{background:var(--lime)}
.opt.on .k{background:var(--lime)}
.opt.on .k span{color:var(--ink)}
.opt.on .k svg{stroke-dashoffset:0}
.opt.on .k.sq span{opacity:0}
.opt.on .t{color:#fff;font-weight:700}
.opt.on::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#D4F03A2e 50%,transparent 70%);animation:sweep .6s ease forwards;pointer-events:none}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.otherline{display:flex;align-items:center;flex:1;margin-left:calc(44 * var(--u));gap:calc(20 * var(--u))}
.otherline .t{margin-left:0;flex:none}
.otherline input{flex:1;min-width:0;border:0;border-bottom:calc(3 * var(--u)) solid var(--rose);background:transparent;outline:none;font-size:calc(30 * var(--u));padding:calc(6 * var(--u)) 0;color:inherit}
.otherline input::placeholder{color:#AEB3BD}
.opt.on .otherline input{border-color:var(--lime)}
.opt.on .otherline input::placeholder{color:#7d828c}

/* ---------- dock ---------- */
.tip{text-align:center;font-size:calc(var(--tipfs) * var(--u));font-weight:500;color:var(--muted);min-height:calc(40 * var(--u));margin-bottom:calc(40 * var(--u));line-height:1.4}
.tip .cur::after{content:"_";animation:blink .8s steps(2) infinite}
.navrow{display:flex;gap:calc(40 * var(--u))}
.btn{--c:calc(24 * var(--u));height:calc(var(--navh) * var(--u));display:flex;align-items:center;box-sizing:border-box;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.back{width:calc(var(--backw) * var(--u));flex:none;--sc:var(--ink);--sf:var(--bg);--sw:calc(3 * var(--u));justify-content:center;font-size:calc(var(--navfs) * var(--u) * .9);font-weight:700}
.screen.dark .btn.back{--sc:#5A5D66;--sf:var(--dark);color:#fff}
.btn.go{flex:1;background:var(--ink);color:#fff;padding:0 calc(50 * var(--u)) 0 calc(44 * var(--u))}
.btn.go .dash{display:flex;gap:calc(10 * var(--u));flex:none}
.btn.go .dash i{width:calc(30 * var(--u));height:calc(14 * var(--u));background:var(--lime);transform:skewX(-24deg);animation:dash 1.4s infinite;animation-delay:calc(var(--i) * .2s)}
@keyframes dash{50%{opacity:.3}}
.btn.go .lbl{margin-left:calc(36 * var(--u));font-size:calc(var(--navfs) * var(--u));font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.go em{font-style:normal;font-family:var(--f-en);font-weight:800;font-size:calc(var(--navfs) * var(--u) * .72);letter-spacing:calc(4 * var(--u));color:var(--lime);white-space:nowrap}
.btn.go.lime{background:var(--lime);color:var(--ink)}
.btn.go.lime em{color:var(--ink)}
.btn.go.lime .dash i{background:var(--ink)}
.btn.go:disabled{background:var(--off);color:#9A9EA7;cursor:not-allowed;justify-content:center;padding:0 calc(30 * var(--u))}
.btn.go:disabled .dash,.btn.go:disabled em{display:none}
.btn.go:disabled .lbl{flex:none;margin:0;font-size:calc(var(--navfs) * var(--u) * .78);font-weight:700;white-space:normal;text-align:center;line-height:1.25}
.screen.dark .btn.go:disabled{background:var(--edge);color:var(--muted)}
.btn.go:not(:disabled){animation:ready .45s var(--ease)}
@keyframes ready{0%{transform:scale(.97)}60%{transform:scale(1.015)}}
.foot{display:flex;align-items:center;gap:calc(30 * var(--u));margin:calc(46 * var(--u)) 0 calc(70 * var(--u));font-family:var(--f-en);font-weight:700;font-size:calc(18 * var(--u));letter-spacing:calc(4 * var(--u));color:var(--muted);white-space:nowrap}
.foot::before,.foot::after{content:"";flex:1;height:calc(2 * var(--u));background:var(--line)}
.screen.dark .foot::before,.screen.dark .foot::after{background:#3A3D45}

/* ---------- ACCESS (camera) ---------- */
.lockhex{position:relative;width:calc(300 * var(--u));height:calc(346 * var(--u));margin:calc(70 * var(--u)) auto 0;display:grid;place-items:center}
.lockhex .o{position:absolute;inset:0;background:#3A3D45}
.lockhex .o::before{content:"";position:absolute;inset:calc(3 * var(--u));background:var(--dark);clip-path:inherit}
.lockhex .i{position:absolute;inset:calc(40 * var(--u)) calc(34 * var(--u));background:var(--lime)}
.lockhex .i::before{content:"";position:absolute;inset:calc(6 * var(--u));background:var(--panel);clip-path:inherit}
.acc-title{text-align:center;font-family:var(--f-en);font-weight:900;font-size:calc(70 * var(--u) * (1 + .26 * (var(--W) - 1170) / 878));letter-spacing:calc(4 * var(--u));margin:calc(40 * var(--u)) 0 0}
.acc-desc{text-align:center;font-size:calc(30 * var(--u));font-weight:600;color:#B9BDC6;margin:calc(24 * var(--u)) 0 0;line-height:1.5}
.vf{--c:calc(30 * var(--u));position:relative;margin:calc(50 * var(--u)) auto 0;width:100%;aspect-ratio:4/5;max-height:calc(100vh - calc(1300 * var(--u)));min-height:calc(560 * var(--u));background:var(--lime);--sw:calc(4 * var(--u))}
.vf .in{position:absolute;inset:var(--sw);background:#0B0C0F;clip-path:inherit;overflow:hidden}
.vf video,.vf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf video.mirror{transform:scaleX(-1)}
.vf .corner{position:absolute;width:calc(64 * var(--u));height:calc(64 * var(--u));border:calc(5 * var(--u)) solid var(--lime);z-index:3}
.vf .c1{left:calc(36 * var(--u));top:calc(36 * var(--u));border-right:0;border-bottom:0}.vf .c2{right:calc(36 * var(--u));top:calc(36 * var(--u));border-left:0;border-bottom:0}
.vf .c3{left:calc(36 * var(--u));bottom:calc(36 * var(--u));border-right:0;border-top:0}.vf .c4{right:calc(36 * var(--u));bottom:calc(36 * var(--u));border-left:0;border-top:0}
.vf .hud{position:absolute;z-index:3;font-family:var(--f-en);font-weight:800;font-size:calc(20 * var(--u));letter-spacing:calc(4 * var(--u));color:#fff;text-shadow:0 1px 4px #000a}
.vf .h1{left:calc(60 * var(--u));top:calc(54 * var(--u))}.vf .h2{right:calc(60 * var(--u));top:calc(54 * var(--u));color:var(--rose)}
.vf .h3{left:calc(60 * var(--u));bottom:calc(54 * var(--u))}.vf .h4{right:calc(60 * var(--u));bottom:calc(54 * var(--u));color:var(--lime)}
.vf .scan{position:absolute;left:0;right:0;height:22%;z-index:2;background:linear-gradient(transparent,#D4F03A30 80%,#D4F03A);animation:scan 2.4s linear infinite}
@keyframes scan{from{top:-22%}to{top:100%}}
.vf .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#C8CCD4;z-index:4;padding:calc(60 * var(--u));font-size:calc(28 * var(--u));line-height:1.6}
.vf .grid2{position:absolute;inset:0;z-index:2;background-image:linear-gradient(#D4F03A33 1px,transparent 1px),linear-gradient(90deg,#D4F03A33 1px,transparent 1px);background-size:12% 9%;animation:gridin 1.2s ease both}
@keyframes gridin{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
.granted{position:absolute;z-index:6;left:50%;top:50%;border:calc(6 * var(--u)) solid var(--lime);color:var(--lime);background:#15161Acc;font-family:var(--f-en);font-weight:900;letter-spacing:calc(4 * var(--u));padding:calc(18 * var(--u)) calc(30 * var(--u));font-size:calc(48 * var(--u));white-space:nowrap;transform:translate(-50%,-50%) rotate(-10deg);animation:slam .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes slam{from{transform:translate(-50%,-50%) rotate(-10deg) scale(2.4);opacity:0}}
.flash{position:fixed;inset:0;background:#fff;z-index:50;pointer-events:none;animation:flash .6s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.limit{display:flex;align-items:center;gap:calc(24 * var(--u));margin-top:calc(36 * var(--u))}
.limit .lab{font-family:var(--f-en);font-weight:800;font-size:calc(22 * var(--u));letter-spacing:calc(5 * var(--u));color:var(--muted);white-space:nowrap}
.limit .bars{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:calc(8 * var(--u))}
.limit .bars i{height:calc(18 * var(--u));background:var(--lime);transform:skewX(-24deg);transition:background .3s}
.limit .bars i.off{background:#2C2E35}
.limit .sec{font-family:var(--f-en);font-weight:900;font-size:calc(44 * var(--u));color:#fff;min-width:calc(90 * var(--u));text-align:right;font-variant-numeric:tabular-nums}
.limit.warn .sec{color:var(--rose);animation:blink .5s steps(2) infinite}
.limit.warn .bars i:not(.off){background:var(--rose)}
.keys{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:calc(24 * var(--u));margin-top:calc(36 * var(--u))}
.key{--c:calc(16 * var(--u));height:calc(130 * var(--u));--sc:var(--edge);--sf:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(8 * var(--u));color:#fff;font-weight:700;font-size:calc(24 * var(--u))}
.key svg{width:calc(48 * var(--u));height:calc(48 * var(--u));stroke:#fff;fill:none;stroke-width:2}
.key small{font-family:var(--f-en);font-size:calc(16 * var(--u));letter-spacing:calc(3 * var(--u));color:var(--muted)}

function uploadPhoto() {
  if (!S.photo) return;
  if (!ENDPOINT) { S.photoState = 'off'; return; }
  const mine = S, shot = mine.photo; mine.photoState = 'up';
  const body = JSON.stringify({ type: 'photo', file: mine.file, agent: mine.agent, image: shot.split(',')[1] });
  const attempt = async (left) => {
    try {
      const r = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });
      const j = await r.json();
      if (!j.ok || !j.id) throw new Error(j.error || 'upload');
      if (mine.photo !== shot) return; // 다시 찍은 경우: 이 사진은 드라이브에만 남김
      mine.photoId = j.id; mine.photoState = 'ok';
    } catch (e) {
      if (left > 0) { await sleep(2500); return attempt(left - 1); }
      if (mine.photo !== shot) return;
      mine.photoState = 'fail';
    }
    if (mine === S && curId === 'success') renderQR(current);
  };
  attempt(2);
}

function restart() { S = fresh(); go('access'); }

function confetti(cv) {
  if (!cv || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const x = cv.getContext('2d'); x.scale(dpr, dpr);
  const cols = ['#D4F03A', '#C93A6B', '#1C1D22', '#AEB3BD'];
  const P = Array.from({ length: 140 }, () => ({ x: r.width / 2, y: r.height * .3, vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 4,
    s: 6 + Math.random() * 10, rot: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * 4)], hex: Math.random() < .5 }));
  const t0 = performance.now();
  const f = now => {
    if (!cv.isConnected) return;
    x.clearRect(0, 0, r.width, r.height);
    P.forEach(p => {
      p.vy += .38; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.rot); x.fillStyle = p.c;
      if (p.hex) { x.beginPath(); for (let k = 0; k < 6; k++) { const a = Math.PI / 3 * k; x.lineTo(Math.cos(a) * p.s / 2, Math.sin(a) * p.s / 2); } x.fill(); }
      else { x.transform(1, 0, -.4, 1, 0, 0); x.fillRect(-p.s / 2, -p.s / 5, p.s, p.s / 2.5); }
      x.restore();
    });
    if (now - t0 < 4500) requestAnimationFrame(f); else x.clearRect(0, 0, r.width, r.height);
  };
  requestAnimationFrame(f);
}

// ====== DATA ======
const HEAD = ['제출시각', '보고서번호', '요원코드명', '사진인증', '기기', '성별', '나이', 'Q1 기초 스킨케어', 'Q2 색조 제품', 'Q3 정보 경로', 'Q3 기타', 'Q4 게임 습관',
  'Q5 성분·정보 흥미/이해도', 'Q6 구매 의향 변화', 'Q7 브랜드 의견', 'Q8 참여형 광고 경험', 'Q9 이유', 'Q10 인상 깊은 존',
  'Q10 인게임 DP존 이유', 'Q10 게임 플레이존 이유', 'Q10 브랜드존 이유', 'Q11 방명록', '소요시간(초)', '사진링크'];
function record() {
  const pick = id => { const q = Q[id], s = S.a[id]; return q.multi ? (s || []).map(i => q.o[i]).join(' | ') : (s != null ? q.o[s] : ''); };
  const ua = navigator.userAgent;
  const dev = /iPad|Macintosh/.test(ua) && navigator.maxTouchPoints > 1 ? 'iPad' : /iPhone/.test(ua) ? 'iPhone' : /Android/.test(ua) ? (/Mobile/.test(ua) ? 'Android 폰' : 'Android 태블릿') : 'PC';
  const d = new Date();
  return {
    '제출시각': `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`,
    '보고서번호': S.file, '요원코드명': S.agent, '사진인증': S.verified ? 'O' : 'X', '기기': `${dev} (${innerWidth}×${innerHeight})`,
    '성별': S.gender || '', '나이': S.age ? (S.age >= 60 ? '60+' : S.age) : '',
    'Q1 기초 스킨케어': pick('q1'), 'Q2 색조 제품': pick('q2'), 'Q3 정보 경로': pick('q3'), 'Q3 기타': (S.a.q3 || []).includes(3) ? S.q3other : '',
    'Q4 게임 습관': pick('q4'), 'Q5 성분·정보 흥미/이해도': S.q5 ? `${S.q5} · ${LIKERT[S.q5 - 1]}` : '',
    'Q6 구매 의향 변화': pick('q6'), 'Q7 브랜드 의견': pick('q7'), 'Q8 참여형 광고 경험': S.q8 ? `${S.q8} · ${MOOD[S.q8 - 1]}` : '',
    'Q9 이유': S.q9.trim(), 'Q10 인상 깊은 존': ZONES.filter(z => S.zones[z.id] != null).map(z => z.name).join(' | '),
    'Q10 인게임 DP존 이유': S.zones.dp || '', 'Q10 게임 플레이존 이유': S.zones.game || '', 'Q10 브랜드존 이유': S.zones.brand || '',
    'Q11 방명록': S.q11.trim(), '소요시간(초)': Math.round((Date.now() - S.started) / 1000), '사진링크': S.photoId ? photoPage(S.photoId) : '',
  };
}
const LS = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
function submit() {
  if (S.sent) return; S.sent = true;
  const r = record();
  const all = LS.get('hb_all', []); all.push(r); LS.set('hb_all', all);
  if (ENDPOINT) { const q = LS.get('hb_queue', []); q.push(r); LS.set('hb_queue', q); flush(); }
}
let flushing = false;
async function flush() {
  if (!ENDPOINT || flushing) return; flushing = true;
  try {
    let q = LS.get('hb_queue', []);
    while (q.length) {
      try { await fetch(ENDPOINT, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(q[0]) }); q.shift(); LS.set('hb_queue', q); }
      catch (e) { break; }
    }
  } finally { flushing = false; }
}
function toCSV(rows) { const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`; return '﻿' + [HEAD.map(cell).join(','), ...rows.map(r => HEAD.map(h => cell(r[h])).join(','))].join('\n'); }
function admin() {
  const all = LS.get('hb_all', []), q = LS.get('hb_queue', []);
  const el = document.createElement('div'); el.className = 'admin';
  el.innerHTML = `<div class="card"><h3>ADMIN · 응답 관리</h3>
    <p>이 기기에 저장된 응답 <b style="color:#fff">${all.length}건</b><br>시트 전송 대기 <b style="color:#fff">${q.length}건</b> · 시트 연결 ${ENDPOINT ? '<b style="color:var(--lime)">ON</b>' : '<b style="color:var(--rose)">OFF</b>'}</p>
    <button class="go" data-csv>CSV 내려받기</button><button data-retry>대기 중인 응답 다시 전송</button><button data-clear>이 기기 기록 비우기</button><button data-x>닫기</button></div>`;
  app.appendChild(el);
  $('[data-x]', el).onclick = () => { el.remove(); go('access'); };
  $('[data-retry]', el).onclick = () => { flush(); toast('다시 전송을 시도했어요'); };
  $('[data-csv]', el).onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([toCSV(all)], { type: 'text/csv' })); a.download = `hexabloom_responses_${Date.now()}.csv`; document.body.appendChild(a); a.click(); a.remove(); };
  const clr = $('[data-clear]', el); let arm = false;
  clr.onclick = () => { if (!arm) { arm = true; clr.textContent = '한 번 더 누르면 삭제돼요'; return; } LS.set('hb_all', []); el.remove(); toast('기기 기록을 비웠어요'); go('access'); };
}
